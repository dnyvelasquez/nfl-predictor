name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main  # Se ejecuta solo cuando haces push a main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # npm ci instala exactamente lo que dice package-lock.json. Con
      # npm install, una versión nueva de una dependencia (como
      # @better-auth/core 1.7.1 el 2026-10-15) puede romper el build sin
      # cambios en el repo.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Angular app
        run: npx ng build nfl-predictor --configuration production

      - name: SPA fallback for GitHub Pages
        run: cp ./dist/nfl-predictor/browser/index.html ./dist/nfl-predictor/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/nfl-predictor/browser
