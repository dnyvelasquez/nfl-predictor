name: Sincronizar NFL (ESPN -> Neon)

on:
  schedule:
    # Modo rápido: cada 5 minutos, TODOS los días, todo el día.
    # 5 min es el mínimo que GitHub permite para cron schedules.
    # No hay que adivinar horarios: el propio script consulta la tabla
    # `juegos` para ver si hay algo cerca de "hoy" antes de llamar a ESPN.
    # Si no hay nada, termina en segundos sin gastar de más. Esto cubre
    # jueves, sábados ocasionales, domingos con partido internacional
    # temprano y Monday Night Football sin necesidad de ventanas manuales.
    - cron: "*/5 * * * *"

    # Modo completo: una vez por semana, martes 01:00 hora Bogotá
    # (06:00 UTC) -> ya pasó el Monday Night Football (termina ~23:00-23:30
    # Bogotá). Refresca equipos.espn_id y recorre las 22 semanas completas,
    # para levantar cambios de calendario, aplazamientos o brackets de
    # playoffs recién definidos.
    - cron: "0 6 * * 2"

  workflow_dispatch: # permite correrlo manualmente desde la pestaña Actions
    inputs:
      mode:
        description: "Modo de sincronización"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full

# GitHub NO garantiza que un cron "*/5 * * * *" dispare cada 5 minutos en la
# práctica: puede demorarse horas bajo carga (visto en producción: solo 2
# corridas en ~7 horas). Para no depender de esa cadencia, cada corrida en
# modo quick reintenta en bucle internamente (ver abajo). Este "concurrency"
# evita que dos corridas del bucle se pisen si GitHub sí llega a disparar
# más seguido de lo esperado.
concurrency:
  group: sync-nfl
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install pg

      - name: Determinar modo
        id: modo
        shell: bash
        run: |
          # Si se disparó manualmente, usa el input elegido.
          # Si se disparó por schedule, usa "full" solo en el cron de las
          # 06:00 UTC (martes); cualquier otro horario programado es "quick".
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 2" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=quick" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar sincronización (full)
        if: steps.modo.outputs.mode == 'full'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEASON_YEAR: "2026"
          MODE: full
        run: node scripts/sync-nfl.mjs

      - name: Ejecutar sincronización en bucle (quick)
        if: steps.modo.outputs.mode == 'quick'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEASON_YEAR: "2026"
          MODE: quick
        shell: bash
        run: |
          # GitHub puede tardar mucho más de 5 minutos en volver a disparar
          # este workflow, así que en vez de confiar en eso, cada corrida se
          # queda repitiendo la sincronización cada 4 minutos durante ~55
          # minutos. Así, mientras GitHub dispare el workflow al menos una
          # vez por hora, los marcadores en vivo se siguen refrescando cada
          # pocos minutos en vez de una sola vez.
          end=$((SECONDS + 55 * 60))
          while true; do
            node scripts/sync-nfl.mjs || true
            [ "$SECONDS" -ge "$end" ] && break
            sleep 240
          done