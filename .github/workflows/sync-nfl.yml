name: Sincronizar NFL (ESPN -> Neon)

on:
  schedule:
    # Modo rápido: cada 5 minutos, TODOS los días, todo el día.
    # 5 min es el mínimo que GitHub permite para cron schedules.
    # No hay que adivinar horarios: el propio script mira el marcador de
    # ESPN (ayer a pasado mañana) y solo se conecta a Neon si hay un juego
    # en vivo o recién terminado, para que el cómputo pueda dormirse el
    # resto del tiempo (cuota mensual del plan gratuito). Esto cubre
    # jueves, sábados ocasionales, domingos con partido internacional
    # temprano y Monday Night Football sin necesidad de ventanas manuales.
    - cron: "*/5 * * * *"

    # Modo completo: una vez por semana, martes 01:00 hora Bogotá
    # (06:00 UTC) -> ya pasó el Monday Night Football (termina ~23:00-23:30
    # Bogotá). Refresca equipos.espn_id y recorre las 22 semanas completas,
    # para levantar cambios de calendario, aplazamientos o brackets de
    # playoffs recién definidos.
    - cron: "0 6 * * 2"

  workflow_dispatch: # permite correrlo manualmente desde la pestaña Actions
    inputs:
      mode:
        description: "Modo de sincronización"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full
      intento:
        description: "Uso interno: contador de auto-reencadenado, no llenar manualmente"
        required: false
        default: "0"

# GitHub NO garantiza que un cron "*/5 * * * *" dispare cada 5 minutos en la
# práctica: puede demorarse horas bajo carga (visto en producción: huecos de
# hasta 3 horas, y corridas que dejan de dispararse solas después de un rato).
# En vez de depender de esa cadencia, cada corrida en modo quick se
# reencadena a sí misma (ver "Reencadenar" abajo) llamando a la API de
# GitHub, y sigue así mientras siga habiendo un juego cerca de hoy, sin
# importar si el cron vuelve a disparar o no. Este "concurrency" evita que
# una corrida encadenada se solape con una que el cron sí llegue a disparar.
concurrency:
  group: sync-nfl
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # necesario para que el paso "Reencadenar" dispare la siguiente corrida
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Solo las dependencias de scripts/ (pg), con su propio lockfile:
      # instalar en la raíz arrastraba todo el árbol de Angular (~900
      # paquetes) y dejó de funcionar el 2026-10-15 sin cambios en el repo.
      - name: Instalar dependencias
        run: npm ci --prefix scripts --no-audit --no-fund

      - name: Determinar modo
        id: modo
        shell: bash
        run: |
          # Si se disparó manualmente, usa el input elegido.
          # Si se disparó por schedule, usa "full" solo en el cron de las
          # 06:00 UTC (martes); cualquier otro horario programado es "quick".
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 2" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=quick" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar sincronización (full)
        if: steps.modo.outputs.mode == 'full'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEASON_YEAR: "2026"
          MODE: full
        run: node scripts/sync-nfl.mjs

      - name: Ejecutar sincronización (quick)
        if: steps.modo.outputs.mode == 'quick'
        id: sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEASON_YEAR: "2026"
          MODE: quick
        run: node scripts/sync-nfl.mjs

      - name: Reencadenar si todavía hay un juego cerca de hoy
        if: steps.modo.outputs.mode == 'quick'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # sync-nfl.mjs deja reencadenar=true en $GITHUB_OUTPUT cuando ESPN
          # tiene algún juego cerca de "hoy" (ayer a pasado mañana), aunque
          # esta corrida no haya tenido que tocar la base. Si es así, esta corrida se dispara a
          # sí misma de nuevo dentro de 4 minutos vía la API de GitHub, en vez
          # de depender de que el cron programado vuelva a disparar solo.
          # Cuando ya no hay ningún juego cerca (p.ej. terminó y el próximo
          # está a varios días), la cadena se corta sola acá.
          reencadenar="${{ steps.sync.outputs.reencadenar }}"
          if [ "$reencadenar" != "true" ]; then
            echo "No hay juegos cerca de hoy, no se reencadena."
            exit 0
          fi

          # Tope de seguridad: por si un bug dejara reencadenar=true para
          # siempre, esto corta la cadena después de ~2000 corridas
          # (~6 días seguidos a ~4,3 min por corrida). Ojo: la ventana de
          # findWeeksNearToday() (-1/+2 días) mantiene la cadena viva todo
          # el fin de semana, de jueves a martes sin pausa; con el tope
          # anterior de 200 (~14 h) se cortó el domingo 2026-10-18 a media
          # mañana y dejó los juegos sin actualizar.
          intento_actual="${{ github.event.inputs.intento || '0' }}"
          intento_siguiente=$((intento_actual + 1))
          limite=2000
          if [ "$intento_siguiente" -gt "$limite" ]; then
            echo "Tope de seguridad de $limite reencadenamientos alcanzado, no se sigue."
            exit 0
          fi

          sleep 240

          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync-nfl.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"mode\":\"quick\",\"intento\":\"$intento_siguiente\"}}"

          echo "Reencadenado (intento $intento_siguiente)."