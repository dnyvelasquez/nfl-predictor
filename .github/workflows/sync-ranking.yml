name: Calcular ranking de equipos (ESPN -> Neon)

on:
  schedule:
    # Corre una vez al día durante la ventana en la que cae el Super Bowl
    # (2do domingo de febrero, con margen). El propio script revisa la
    # tabla `juegos` de esta base de datos y termina de inmediato sin
    # llamar a ESPN si el juego de etapa='superbowl' todavía no tiene
    # resultado cargado, así que no hay problema en que corra varios días
    # antes de que el Super Bowl se juegue.
    - cron: "0 12 1-20 2 *"

  workflow_dispatch: # permite correrlo manualmente desde la pestaña Actions

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Solo las dependencias de scripts/ (pg), con su propio lockfile:
      # instalar en la raíz arrastraba todo el árbol de Angular (~900
      # paquetes) y dejó de funcionar el 2026-10-15 sin cambios en el repo.
      - name: Instalar dependencias
        run: npm ci --prefix scripts --no-audit --no-fund

      - name: Calcular ranking
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEASON_YEAR: "2026"
        run: node scripts/sync-ranking.mjs
