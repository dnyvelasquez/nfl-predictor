<div class="admin-container">
  <mat-card class="admin-card">
    <div class="header">
      <img src="https://static.www.nfl.com/image/upload/v1554321393/league/nvfr7ogywskqrfaiu38m.svg" alt="NFL Logo" class="logo">
      <h1>NFL Predictor 2026-2027</h1>
      <h1> 🏈</h1>
    </div>
    <mat-divider></mat-divider>

    <h2 class="subtitle">{{ 'admin.modulo' | t }}</h2>
    @if (rolLabel()) { <p class="rol">{{ rolLabel() }}</p> }
    <mat-divider></mat-divider>

    <div class="button-container">
      <button mat-button routerLink="/ingresar-juego">
        <mat-icon>sports_football</mat-icon>
        <span>{{ 'admin.ingresarJuego' | t }}</span>
      </button>
      <button mat-button routerLink="/participantes">
        <mat-icon>people</mat-icon>
        <span>{{ 'admin.participantes' | t }}</span>
      </button>
      <button mat-button routerLink="/asignacion">
        <mat-icon>dashboard_customize</mat-icon>
        <span>{{ 'admin.asignacion' | t }}</span>
      </button>
      @if (esAdministrador()) {
        <button mat-button routerLink="/nuevo-usuario">
          <mat-icon>person_add</mat-icon>
          <span>{{ 'admin.nuevoUsuario' | t }}</span>
        </button>
      }
      @if (esAdministrador()) {
        <button mat-button routerLink="/usuario">
          <mat-icon>manage_accounts</mat-icon>
          <span>{{ 'admin.usuarios' | t }}</span>
        </button>
      }
      <button mat-button (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>{{ 'admin.logout' | t }}</span>
      </button>
    </div>
  </mat-card>
</div>
