<mat-toolbar color="primary" class="header-toolbar">
  <div class="title" routerLink="/">
    <img src="https://static.www.nfl.com/image/upload/v1554321393/league/nvfr7ogywskqrfaiu38m.svg" alt="NFL Logo" class="logo">
    <span class="title">NFL Predictor 🏈</span>
    <span class="spacer"></span>
  </div>

  <!-- Menú en desktop -->
  <nav class="menu-desktop">
    <button class="menu-button" mat-button routerLink="/">
      <mat-icon class="icon">home</mat-icon> {{ 'header.home' | t }}
    </button>
    <button class="menu-button" mat-button routerLink="/tabla-puntajes">
      <mat-icon class="icon">leaderboard</mat-icon> {{ 'header.tablaPuntajes' | t }}
    </button>
    <button class="menu-button" mat-button routerLink="/juegos">
      <mat-icon class="icon">sports_football</mat-icon> {{ 'header.juegos' | t }}
    </button>
    <div
      class="menu-button-container desktop-2"
      (mouseenter)="equiposMenuTrigger.openMenu()"
    >
      <button
        class="menu-button"
        mat-button
        [matMenuTriggerFor]="equiposSubMenu"
        #equiposMenuTrigger="matMenuTrigger"
        routerLink="/equipos"
      >
        <mat-icon class="icon">groups</mat-icon> {{ 'header.equipos' | t }}
        <mat-icon class="dropdown-icon">arrow_drop_down</mat-icon>
      </button>

      <mat-menu #equiposSubMenu="matMenu" class="submenu-hover">
        <div (mouseenter)="equiposMenuTrigger.openMenu()" (mouseleave)="equiposMenuTrigger.closeMenu()">
          <button mat-menu-item routerLink="/equipos">
            <mat-icon>sports</mat-icon> {{ 'header.enCompeticion' | t }}
          </button>
          <button mat-menu-item routerLink="/fixture">
            <mat-icon>calendar_today</mat-icon> {{ 'header.fixture' | t }}
          </button>
          <button mat-menu-item routerLink="/ranking">
            <mat-icon>format_list_numbered</mat-icon> {{ 'header.ranking' | t }}
          </button>
        </div>
      </mat-menu>
    </div>
    <button class="menu-button desktop-2" mat-button routerLink="/reglamento">
      <mat-icon class="icon">gavel</mat-icon> {{ 'header.reglamento' | t }}
    </button>
    @if (acceso() === 'lectura') {
      <button class="menu-button desktop-2" mat-button (click)="cerrarSesion()">
        <mat-icon class="icon">logout</mat-icon> {{ 'header.cerrarSesion' | t }}
      </button>
    } @else {
      <button class="menu-button desktop-2" mat-button routerLink="/admin">
        <mat-icon class="icon">admin_panel_settings</mat-icon> {{ 'header.admin' | t }}
      </button>
    }
  </nav>

  <!-- Idioma (desktop y móvil) y menú hamburguesa (solo móvil) -->
  <div class="acciones">
  <button mat-button class="boton-idioma" (click)="alternarIdioma()"
          [attr.aria-label]="'header.cambiarIdioma' | t" [title]="'header.cambiarIdioma' | t">
    <mat-icon>translate</mat-icon>
    <span class="idioma-actual">{{ idioma.actual() === 'es' ? 'ES' : 'EN' }}</span>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="menu" class="menu-mobile">
    <mat-icon>menu</mat-icon>
  </button>
  </div>

<mat-menu #menu="matMenu">
  <button class="mobile-2" mat-menu-item routerLink="/">
    <mat-icon>home</mat-icon>
    <span>{{ 'header.home' | t }}</span>
  </button>
  <button class="mobile-2" mat-menu-item routerLink="/tabla-puntajes">
    <mat-icon>leaderboard</mat-icon>
    <span>{{ 'header.tablaPuntajes' | t }}</span>
  </button>
  <button class="mobile-2" mat-menu-item routerLink="/juegos">
    <mat-icon>sports_football</mat-icon>
    <span>{{ 'header.juegos' | t }}</span>
  </button>
  <!-- Submenú en móvil: se mantiene como clic tradicional -->
  <button mat-menu-item [matMenuTriggerFor]="equiposMobileSubMenu">
    <mat-icon>groups</mat-icon>
    <span>{{ 'header.equipos' | t }}</span>
  </button>
  <mat-menu #equiposMobileSubMenu="matMenu">
    <button mat-menu-item routerLink="/equipos">
      <mat-icon>sports</mat-icon>
      <span>{{ 'header.enCompeticion' | t }}</span>
    </button>
    <button mat-menu-item routerLink="/fixture">
      <mat-icon>calendar_today</mat-icon>
      <span>{{ 'header.fixture' | t }}</span>
    </button>
    <button mat-menu-item routerLink="/ranking">
      <mat-icon>format_list_numbered</mat-icon>
      <span>{{ 'header.ranking' | t }}</span>
    </button>
  </mat-menu>
  <button mat-menu-item routerLink="/reglamento">
    <mat-icon>gavel</mat-icon>
    <span>{{ 'header.reglamento' | t }}</span>
  </button>
  @if (acceso() === 'lectura') {
    <button mat-menu-item (click)="cerrarSesion()">
      <mat-icon>logout</mat-icon>
      <span>{{ 'header.cerrarSesion' | t }}</span>
    </button>
  } @else {
    <button mat-menu-item routerLink="/admin">
      <mat-icon>admin_panel_settings</mat-icon>
      <span>{{ 'header.admin' | t }}</span>
    </button>
  }
</mat-menu>
