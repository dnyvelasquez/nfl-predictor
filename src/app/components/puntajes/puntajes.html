<div class="puntajes-container">
  <mat-card class="puntajes-card">
    <div class="header">
      <img src="https://static.www.nfl.com/image/upload/v1554321393/league/nvfr7ogywskqrfaiu38m.svg" alt="NFL Logo" class="logo">
      <mat-card-title class="puntajes-title">Puntajes</mat-card-title>
      <h1> 🏈</h1>
      <mat-divider></mat-divider>
    </div>

    <div class="button-container">
      <button class="left" mat-icon-button routerLink="/admin" aria-label="Volver">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <button mat-stroked-button (click)="acumular()" [disabled]="loading">
          <mat-icon>calculate</mat-icon>&nbsp;Acumular
      </button>
      <button mat-stroked-button (click)="resetAll()" [disabled]="loading">
          <mat-icon>restart_alt</mat-icon>&nbsp;Reset
      </button>
      <button class="right" mat-icon-button (click)="logout()" aria-label="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </div>

    @if (loading) {
      <div class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Cargando equipos...</p>
      </div>
    } @else {
      <div class="table-container">
        @for (e of equipos; track e.id) {
          <div class="puntajes-table">
            <div class="equipos">
              <div class="equipo">
                <img [src]="e.logo" alt="{{ e.nombre }}" class="equipo-logo">
                <div class="info-equipo">
                  <span>{{ e.nombre }}</span>
                  <span class="participante">
                    {{ e.participante }}
                  </span>
                </div>
              </div>

              <div class="info">
                <mat-form-field appearance="fill" class="score">
                  <mat-label>PG</mat-label>
                  <input type="number" matInput placeholder="0" [(ngModel)]="e.pg" />
                </mat-form-field>
                <mat-form-field appearance="fill" class="score">
                  <mat-label>PE</mat-label>
                  <input type="number" matInput placeholder="0" [(ngModel)]="e.pe"  />
                </mat-form-field>
                <mat-form-field appearance="fill" class="score">
                  <mat-label>PP</mat-label>
                  <input type="number" matInput placeholder="0" [(ngModel)]="e.pp"  />
                </mat-form-field>
              </div>
              <div class="info">
                <mat-form-field appearance="fill" class="score">
                  <mat-label>PW</mat-label>
                  <input type="number" matInput placeholder="0"  [(ngModel)]="e.pw" />
                </mat-form-field>
                <mat-form-field appearance="fill" class="score">
                  <mat-label>PD</mat-label>
                  <input type="number" matInput placeholder="0"  [(ngModel)]="e.pd" />
                </mat-form-field>
              </div>
              <div class="info">
                <mat-form-field appearance="fill" class="score">
                  <mat-label>PC</mat-label>
                  <input type="number" matInput placeholder="0"  [(ngModel)]="e.pc" />
                </mat-form-field>
                <mat-form-field appearance="fill" class="score">
                  <mat-label>SB</mat-label>
                  <input type="number" matInput placeholder="0"  [(ngModel)]="e.sb" />
                </mat-form-field>
              </div>
              <button class="controll" mat-icon-button (click)="guardarPuntos(e)" [disabled]="loading">
                  <mat-icon>update</mat-icon>
              </button>
            </div>
          </div>
        } @empty {
          <div class="empty-container">
            <mat-icon>sports_football</mat-icon>
            <p>No hay equipos con participantes asignados</p>
          </div>
        }
      </div>
    }
  </mat-card>
</div>
